plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.github.EaseCation'
base.archivesName = 'BedrockMotion'
version = '1.0.0'

repositories {
    mavenLocal()
    mavenCentral()
    maven { url 'https://repo.viaversion.com' }
    maven { url 'https://jitpack.io' }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    api 'team.unnamed:mocha:3.0.1'
    // 不再 transitive=false:需要让 CubeConverter 的 compileOnlyApi(ViaProxy 侧 relocated gson)
    // 透传到本工程 compile classpath,以解析其解析器重载签名。CubeConverter 仅 compileOnlyApi 会传递
    // (其余为 implementation,不外泄;plain 分支无 api 依赖),不影响运行期与 NeoForge。
    api('com.github.EaseCation:CubeConverter:1.3')
    api 'org.joml:joml:1.10.8'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'org.apache.commons:commons-lang3:3.17.0'

    compileOnly 'org.slf4j:slf4j-api:2.0.16'
    compileOnly 'org.projectlombok:lombok:1.18.36'
    annotationProcessor 'org.projectlombok:lombok:1.18.36'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:6.0.3'
    testImplementation('com.viaversion:viaversion-common:5.9.2-SNAPSHOT') {
        attributes {
            attribute(Bundling.BUNDLING_ATTRIBUTE, objects.named(Bundling, Bundling.SHADOWED))
        }
    }
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.16'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:6.0.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.0.3'
}

tasks.named('test') {
    useJUnitPlatform()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = 'com.github.EaseCation'
            artifactId = 'BedrockMotion'
        }
    }
}
