plugins {
    id 'java-library'
    id 'maven-publish'
}

// EaseCation library published to the private Yunxiao repository as net.easecation:bedrock-motion
// (artifactId = project name), see GeyserWorkspace docs/maven-coordinates.md. Was com.github.EaseCation:BedrockMotion.
group = 'net.easecation'
base.archivesName = 'BedrockMotion'
version = '1.2.0'

repositories {
    // EaseCation private repository (Aliyun Yunxiao Packages), only for net.easecation.* coordinates.
    // Credentials: yunxiaoMavenUsername / yunxiaoMavenPassword in ~/.gradle/gradle.properties.
    exclusiveContent {
        forRepository {
            maven {
                name = "yunxiaoMaven"
                url = "https://easecation-cn-hangzhou.devops.aliyuncs.com/packages/api/protocol/maven/14075-release-h64s7e"
                credentials(PasswordCredentials)
            }
        }
        filter { includeGroupByRegex "net\\.easecation(\\..*)?" }
    }
    mavenCentral()
    maven { url 'https://repo.viaversion.com' }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    api 'net.easecation.fork.unnamed:mocha:3.0.1-ec.2' // EaseCation Mocha fork
    // CubeConverter comes in two flavors with the same classes: cubeconverter-gson (plain Gson, NeoForge) and
    // cubeconverter (ViaVersion-relocated Gson, ViaProxy). Since 1.2.0 this library is built and published
    // against the plain-Gson flavor, which carries the render-controller uv_anim API it uses; ViaProxy-side
    // consumers exclude it and depend on the relocated flavor instead.
    api('net.easecation.fork.oryxel.cube:cubeconverter-gson:1.3-ec.2') // EaseCation CubeConverter fork
    api 'org.joml:joml:1.10.8'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'org.apache.commons:commons-lang3:3.17.0'

    compileOnly 'org.slf4j:slf4j-api:2.0.16'
    compileOnly 'org.projectlombok:lombok:1.18.36'
    annotationProcessor 'org.projectlombok:lombok:1.18.36'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:6.0.3'
    testImplementation('net.easecation.fork.viaversion:viaversion-common:5.9.2-ec.1') {
        attributes {
            attribute(Bundling.BUNDLING_ATTRIBUTE, objects.named(Bundling, Bundling.SHADOWED))
        }
    }
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.16'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:6.0.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.0.3'
}

tasks.named('test') {
    useJUnitPlatform()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        // EaseCation private repository (Aliyun Yunxiao Packages).
        // Credentials: yunxiaoMavenUsername / yunxiaoMavenPassword in ~/.gradle/gradle.properties.
        maven {
            name = "yunxiaoMaven"
            url = version.toString().endsWith('-SNAPSHOT')
                    ? 'https://easecation-cn-hangzhou.devops.aliyuncs.com/packages/api/protocol/maven/14075-snapshot-bjmmxv'
                    : 'https://easecation-cn-hangzhou.devops.aliyuncs.com/packages/api/protocol/maven/14075-release-h64s7e'
            credentials(PasswordCredentials)
        }
    }
}
